<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>v2 · Разбор</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#706d66}a:hover{color:#171716}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f3f0e8; font-family: Inter, sans-serif; color: #171716; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 24px">
<div style="background: #fffefa; border-radius: 20px; border: 1px solid rgba(23,23,22,0.11); padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px">
<div style="width: 28px; height: 28px; border-radius: 8px; background: #171716; color: #fffefa; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">ТЫ</div>
<div style="font-weight: 600; color: #706d66; flex: 1">Ты</div>
<div style="font-family: Poppins, sans-serif; font-weight: 900; font-size: 20px">18%</div>
<div style="width: 1px; align-self: stretch; background: rgba(23,23,22,0.11); margin: 0 4px"></div>
<div style="text-align: right; font-size: 12px; color: #706d66; line-height: 1.3"><b style="color: #171716; font-size: 14px">Круг 2</b><br>из 20</div>
</div>
<div style="height: 8px; border-radius: 999px; background: #e9e5dc; display: flex; overflow: hidden"><div style="width: 18%; background: #f04a3e"></div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: Poppins, sans-serif; font-weight: 900; font-size: 36px; line-height: 1.1; color: #d83830">Мимо</div>
<div style="font-size: 15px; font-weight: 600; color: #3d3b37">{{subtitle}}</div>
</div>
<div style="background: #fffefa; border-radius: 20px; border: 1px solid rgba(23,23,22,0.11); overflow: hidden">
<sc-if value="{{showMine}}" hint-placeholder-val="{{true}}">
<div style="padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(23,23,22,0.11)">
<div style="font-size: 13px; color: #706d66">Твой ответ</div>
<div style="font-size: 17px; font-weight: 700; color: #b3261e; text-decoration: line-through">астат</div>
</div>
</sc-if>
<div style="padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: #ecf5ef">
<div style="font-size: 13px; color: #706d66">Правильный</div>
<div style="font-size: 17px; font-weight: 700; color: #11693c">аргон</div>
</div>
</div>
<div style="font-size: 15px; color: #3d3b37; line-height: 1.5">Ar — аргон, элемент номер 18 в таблице Менделеева.</div>
<a href="#report" style="align-self: flex-start; font-size: 13px; font-weight: 600; padding: 8px 0">Сообщить о проблеме</a>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<div style="text-align: center; font-size: 13px; color: #706d66">В этом раунде без мини-игры</div>
<button style="height: 56px; border: none; border-radius: 16px; background: #171716; color: #fffefa; font-family: Inter, sans-serif; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; cursor: pointer">Следующий вопрос<span aria-hidden="true">→</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"timeout":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const timeout = this.props.timeout ?? false;
return { showMine: !timeout, subtitle: timeout ? 'Время вышло' : 'Неверный ответ' };
}
}
</script>
</body>
</html>
