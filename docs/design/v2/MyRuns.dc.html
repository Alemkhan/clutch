<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>v2 · Партии</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f3f0e8; font-family: Inter, sans-serif; color: #171716; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 32px 20px 0; display: flex; flex-direction: column; gap: 24px">
<div style="font-family: Poppins, sans-serif; font-weight: 900; font-size: 32px; letter-spacing: -0.6px; line-height: 1.1">Партии</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; font-weight: 700; color: #706d66">Вызовы</div>
<div style="background: #171716; color: #fffefa; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<div style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 17px">Игрок dbec зовёт на реванш</div>
<div style="font-size: 12px; color: #a8a49b; flex: none">6 дн.</div>
</div>
<div style="font-size: 14px; color: #d8d4cb; line-height: 1.5">Обошёл тебя: <b style="color: #fffefa">5 кругов</b> против твоих 9</div>
</div>
<button style="height: 48px; border: none; border-radius: 16px; background: #f04a3e; color: #fff; font-family: Inter, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">Принять реванш</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; font-weight: 700; color: #706d66">История</div>
<div style="background: #fffefa; border: 1px solid rgba(23,23,22,0.11); border-radius: 20px; overflow: hidden">
<sc-for list="{{runs}}" as="r" hint-placeholder-count="3">
<div style="{{r.rowStyle}}">
<div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
<div style="font-size: 15px; font-weight: 700">{{r.line}}</div>
<div style="font-size: 12px; color: #706d66">{{r.meta}}</div>
</div>
<div style="{{r.pillStyle}}">{{r.outcome}}</div>
</div>
</sc-for>
</div>
</div>
</div>

<div style="margin-top: auto; height: 64px; background: #fffefa; border-top: 1px solid rgba(23,23,22,0.11); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; text-align: center; font-size: 11px; font-weight: 600; color: #706d66">
<div>Главная</div><div style="color: #f04a3e">Партии</div><div>Тренировка</div><div>Профиль</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const pill = (bg, fg) => 'flex: none; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 10px; background: ' + bg + '; color: ' + fg;
const row = (first) => 'display: flex; align-items: center; gap: 12px; padding: 16px 20px;' + (first ? '' : ' border-top: 1px solid rgba(23,23,22,0.11)');
const runs = [
{ outcome: 'Ждём', line: '100% за 7 кругов', meta: 'Общие знания · сегодня, 12:40', pillStyle: pill('#e8eefc', '#2f55c4') },
{ outcome: 'Поражение', line: '9 кругов против 5', meta: 'Общие знания · сегодня, 00:28 · Игрок dbec', pillStyle: pill('#fde4e1', '#b3261e') },
{ outcome: 'Победа', line: '6 кругов против 8', meta: 'География · вчера, 21:15 · Игрок 2dbf', pillStyle: pill('#dff2e7', '#11693c') }
].map((r, i) => ({ ...r, rowStyle: row(i === 0) }));
return { runs };
}
}
</script>
</body>
</html>
