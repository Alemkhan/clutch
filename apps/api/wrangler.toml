name = "clutch-api"
main = "src/index.ts"
compatibility_date = "2024-10-01"

[vars]
ENVIRONMENT = "development"

# Clutch API namespace; this ID must be unique in the target Cloudflare account.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "7392401"

[ratelimits.simple]
limit = 30
period = 60

# D1 database
# Run `wrangler d1 create clutch-db` and replace the database_id below
[[d1_databases]]
binding = "DB"
database_name = "clutch-db"
database_id = "2de23ae8-3ad2-4052-aca6-60477fd7eb4a"

# Observability
[observability]
enabled = true
