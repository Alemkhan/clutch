<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#171410;color:#f7f1e4;font-family:'Inter',sans-serif;
    padding:80px;display:flex;flex-direction:column;justify-content:space-between}
  .label{font-weight:900;font-size:32px;letter-spacing:.18em;opacity:.65}
  .headline{font-weight:900;font-size:98px;line-height:1.04;letter-spacing:-.035em;max-width:1010px}
  .row{display:flex;align-items:center;gap:28px}
  .bar{height:34px;width:200px;border-radius:17px;background:#7a7266}
  .hint{font-weight:700;font-size:30px;opacity:.55;letter-spacing:-.01em}
</style></head><body>
  <div class="label">CLUTCH</div>
  <div class="headline">Почти получилось!</div>
  <div class="row"><div class="bar"></div><div class="hint">у всех один набор вопросов</div></div>
</body></html>
